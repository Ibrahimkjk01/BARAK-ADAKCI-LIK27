<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barak Adakçılık | Gaziantep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1b4332; --accent: #d4af37; --whatsapp: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--accent); }
        .container { max-width: 500px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: var(--primary); border-left: 5px solid var(--accent); padding-left: 10px; margin-bottom: 20px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; margin: 10px 0; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem; color: white; transition: 0.3s; }
        .btn-wa { background: var(--whatsapp); }
        .btn-map { background: #007bff; }
        .btn-call { background: var(--primary); }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 15px; font-size: 1.05rem; }
    </style>
</head>
<body>

<header>
    <h1>BARAK ADAKÇILIK</h1>
    <p>Gaziantep Adaklık & Kurbanlık</p>
</header>

<div class="container">
    <div class="card">
        <h2>İletişim</h2>
        <!-- Numaranı buraya 905XXXXXXXXX şeklinde yaz -->
        <a href="https://wa.me/905551942780" class="btn btn-wa"><i class="fab fa-whatsapp"></i> WhatsApp'tan Fiyat Al</a>
        <a href="tel:+905551942780" class="btn btn-call"><i class="fas fa-phone"></i> Hemen Ara</a>
        <!-- Harita Butonu -->
        <a href="https://www.google.com/maps/search/Gaziantep+Araç+Muayene+İstasyonu" target="_blank" class="btn btn-map">
            <i class="fas fa-map-marked-alt"></i> Yol Tarifi Al (Harita)
        </a>
    </div>

    <div class="card">
        <h2>Hizmetlerimiz</h2>
        <ul>
            <li><i class="fas fa-check-circle" style="color:green;"></i> İslami usullere uygun kesim</li>
            <li><i class="fas fa-check-circle" style="color:green;"></i> Ücretsiz parçalama & paketleme</li>
            <li><i class="fas fa-check-circle" style="color:green;"></i> Görüntülü vekaletli kesim</li>
            <li><i class="fas fa-check-circle" style="color:green;"></i> Adrese teslim imkanı</li>
        </ul>
    </div>
</div>

</body>
</html>
